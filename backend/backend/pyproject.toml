[project]
name = "neuroalianza-backend"
version = "0.1.0"
description = "Backend para Neuroalianza - Plataforma de detección y seguimiento de neurodesarrollo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "uuid6>=2024.7.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
    "schemathesis>=3.37.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.1",
    "bandit>=1.7.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # Incompatible with D211
    "D213",    # Incompatible with D212
    "COM812",  # Conflict with formatter
    "ISC001",  # Conflict with formatter
    "CPY001",  # Missing copyright notice
    "ANN401",  # Dynamically typed expressions (Any) where necessary
    "TC001",   # Move application import into type-checking block
    "TC002",   # Move third-party import into type-checking block
    "TC003",   # Move standard library import into type-checking block
    "TRY003",  # Avoid specifying long messages outside exception class
    "EM101",   # Exception must not use string literal
    "EM102",   # Exception must not use f-string literal
    "PLW0603", # Using global statement
    "UP046",   # Generic class syntax
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Use of assert
    "PLR2004",  # Magic value used in comparison
    "ANN001",   # Missing type annotation for function argument
    "ANN002",   # Missing type annotation for *args
    "ANN003",   # Missing type annotation for **kwargs
    "ANN201",   # Missing return type annotation for public function
    "ANN202",   # Missing return type annotation for private function
    "D100",     # Missing docstring in public module
    "D101",     # Missing docstring in public class
    "D102",     # Missing docstring in public method
    "D103",     # Missing docstring in public function
    "D104",     # Missing docstring in public package
    "ARG001",   # Unused function argument (fixture)
    "SIM117",   # Use a single with statement with multiple contexts
    "DTZ001",   # Datetime without tzinfo (for testing naive fallback)
]
"app/api/routes/*" = ["B008"]  # Depends() in default arguments
"app/seed/*" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-type-checking]
strict = false

[tool.ruff.lint.isort]
known-first-party = ["app"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_unimported = true
disallow_any_expr = false  # Impracticable with Pydantic
disallow_any_decorated = false  # Impracticable with FastAPI decorators
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = true
warn_unreachable = true
warn_no_return = true
strict_equality = true
strict_bytes = true
extra_checks = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
    "unimported-reveal",
]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.domain.*"]
disallow_any_explicit = false
warn_return_any = true

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Arquitectura en capas"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.ports",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "El dominio no depende de nada"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.adapters",
    "app.ports",
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Adaptadores solo desde el composition root"
type = "forbidden"
source_modules = ["app.api", "app.services", "app.domain"]
forbidden_modules = ["app.adapters"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modulos de dominio independientes entre si"
type = "independence"
modules = [
    "app.domain.screening",
    "app.domain.casefile",
    "app.domain.scheduling",
    "app.domain.alerts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/main.py",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "assert_never",
    "@abstractmethod",
    "\\.\\.\\.",
    "pass",
]
